server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-фолбэк: любые маршруты React Router отдают index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Статика кэшируется надолго (файлы с хэшами в имени)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
